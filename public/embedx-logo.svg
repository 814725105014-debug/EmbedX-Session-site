<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Chip Base -->
  <rect x="18" y="18" width="64" height="64" rx="14" fill="#101828" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)" />
  <rect x="22" y="22" width="56" height="56" rx="10" fill="#0B1220" />

  <!-- Integrated Circuit Pins -->
  <line x1="32" y1="10" x2="32" y2="18" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="10" x2="50" y2="18" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
  <line x1="68" y1="10" x2="68" y2="18" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />

  <line x1="32" y1="82" x2="32" y2="90" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="82" x2="50" y2="90" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
  <line x1="68" y1="82" x2="68" y2="90" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />

  <line x1="10" y1="32" x2="18" y2="32" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="10" y1="50" x2="18" y2="50" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
  <line x1="10" y1="68" x2="18" y2="68" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />

  <line x1="82" y1="32" x2="90" y2="32" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="82" y1="50" x2="90" y2="50" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
  <line x1="82" y1="68" x2="90" y2="68" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Futuristic X / Core Symbol -->
  <path d="M34 34 L66 66 M66 34 L34 66" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round" />
  <circle cx="50" cy="50" r="4.5" fill="#38BDF8" />
  
  <!-- Circuit Nodes -->
  <circle cx="34" cy="34" r="2.5" fill="#06B6D4" />
  <circle cx="66" cy="34" r="2.5" fill="#06B6D4" />
  <circle cx="34" cy="66" r="2.5" fill="#2563EB" />
  <circle cx="66" cy="66" r="2.5" fill="#2563EB" />
</svg>
